<text x="285.5" y="220" font-size="12.5" fill="#b8bccb" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">starts it</text>
<line x1="573" y1="196" x2="647" y2="196" stroke="#8b90a3" stroke-width="2"/><path d="M656,196 L646,201 L646,191 Z" fill="#8b90a3"/>
<text x="614.5" y="184" font-size="12.5" fill="#b8bccb" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">runs them</text>
<text x="450" y="330" font-size="14" fill="#b8bccb" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The extension brings no symcc of its own. Update symcc with your harness.</text>
</svg>
