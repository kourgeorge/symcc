<rect x="1" y="1" width="898" height="358" rx="24" fill="url(#bg)" stroke="#3a3f4f" stroke-width="2"/>
<text x="450" y="46" font-size="21" font-weight="700" fill="#f5f5f7" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">symcc in VS Code and Cursor</text><text x="450" y="72" font-size="14" fill="#b8bccb" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">You install symcc once. The extension is a window onto it.</text>
<rect x="36" y="98" width="200" height="196" rx="14" fill="#222634" stroke="#3a3f4f" stroke-width="1.5"/><text x="54" y="126" font-size="13" font-weight="600" fill="#7aa7f0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Your editor</text><text x="54" y="152" font-size="18" font-weight="700" fill="#f5f5f7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">symcc extension</text><text x="54" y="178" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">board panel and sidebar</text><text x="54" y="198" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">files, diffs, terminals</text>
