<rect x="335" y="98" width="230" height="196" rx="14" fill="#222634" stroke="#3a3f4f" stroke-width="1.5"/><text x="353" y="126" font-size="13" font-weight="600" fill="#f2a58a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Installed once</text><text x="353" y="152" font-size="18" font-weight="700" fill="#f5f5f7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">symcc</text><text x="353" y="178" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">by Claude Code, Copilot CLI</text><text x="353" y="198" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">or OpenCode</text>
<rect x="353" y="222" width="139" height="24" rx="12" fill="#1b1f2a" stroke="#4a5063" stroke-width="1"/><text x="422.5" y="238.5" font-size="12" fill="#b8bccb" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">editor/serve.mjs</text>
