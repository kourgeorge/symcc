<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="symcc in VS Code and Cursor. You install symcc once, with Claude Code, Copilot CLI or OpenCode. The symcc extension in your editor finds that copy, starts it and shows its board panel and sidebar; the extension itself only does what needs the editor, such as files, diffs and terminals. symcc runs the agents, Cursor's or GitHub Copilot's: the lead and the workers, each task in its own git worktree. The extension brings no symcc of its own, so you update symcc with your harness.">
<title>symcc in VS Code and Cursor</title>
