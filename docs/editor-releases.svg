<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Two things to release. The plugin, for most changes: you change the engine, serve or the board's webview; you release it by rebuilding editor/, bumping the version and merging; people get it with their harness's update, then Restart symcc in the editor. The extension, rarely: you change how it finds symcc, its frame or its editor glue; you release it by bumping its version, merging and pushing a vscode-v tag; people get it from the VS Code Marketplace or Open VSX, on its own. When the protocol number is raised, release the extension first, then the plugin.">
<title>Two things to release</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1f2a"/><stop offset="1" stop-color="#2a2233"/></linearGradient></defs>
<rect x="1" y="1" width="898" height="428" rx="24" fill="url(#bg)" stroke="#3a3f4f" stroke-width="2"/>
<text x="450" y="46" font-size="21" font-weight="700" fill="#f5f5f7" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Two things to release</text><text x="450" y="72" font-size="14" fill="#b8bccb" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Most changes need only a plugin release.</text>
<text x="36" y="154" font-size="17" font-weight="700" fill="#f2a58a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The plugin</text><text x="36" y="176" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">most changes</text><rect x="214" y="100" width="194" height="112" rx="14" fill="#222634" stroke="#3a3f4f" stroke-width="1.5"/><text x="232" y="134" font-size="15" font-weight="700" fill="#f5f5f7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">You change</text><text x="232" y="172" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the engine, serve or</text><text x="232" y="192" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the board's webview</text><line x1="413" y1="156" x2="428" y2="156" stroke="#8b90a3" stroke-width="2"/><path d="M437,156 L427,161 L427,151 Z" fill="#8b90a3"/><rect x="442" y="100" width="194" height="112" rx="14" fill="#222634" stroke="#3a3f4f" stroke-width="1.5"/><text x="460" y="134" font-size="15" font-weight="700" fill="#f5f5f7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Release it</text><text x="460" y="172" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">rebuild <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">editor/</tspan>, bump</text><text x="460" y="192" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the version, merge</text><line x1="641" y1="156" x2="656" y2="156" stroke="#8b90a3" stroke-width="2"/><path d="M665,156 L655,161 L655,151 Z" fill="#8b90a3"/><rect x="670" y="100" width="194" height="112" rx="14" fill="#222634" stroke="#3a3f4f" stroke-width="1.5"/><text x="688" y="134" font-size="15" font-weight="700" fill="#f5f5f7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">People get it</text><text x="688" y="172" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">with their harness's</text><text x="688" y="192" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">update; Restart symcc</text>
<text x="36" y="294" font-size="17" font-weight="700" fill="#7aa7f0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The extension</text><text x="36" y="316" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">rarely</text><rect x="214" y="240" width="194" height="112" rx="14" fill="#222634" stroke="#3a3f4f" stroke-width="1.5"/><text x="232" y="274" font-size="15" font-weight="700" fill="#f5f5f7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">You change</text><text x="232" y="312" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">how it finds symcc,</text><text x="232" y="332" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">its frame or glue</text><line x1="413" y1="296" x2="428" y2="296" stroke="#8b90a3" stroke-width="2"/><path d="M437,296 L427,301 L427,291 Z" fill="#8b90a3"/><rect x="442" y="240" width="194" height="112" rx="14" fill="#222634" stroke="#3a3f4f" stroke-width="1.5"/><text x="460" y="274" font-size="15" font-weight="700" fill="#f5f5f7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Release it</text><text x="460" y="312" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">bump, merge, push a</text><text x="460" y="332" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">vscode-v&lt;version&gt;</tspan> tag</text><line x1="641" y1="296" x2="656" y2="296" stroke="#8b90a3" stroke-width="2"/><path d="M665,296 L655,301 L655,291 Z" fill="#8b90a3"/><rect x="670" y="240" width="194" height="112" rx="14" fill="#222634" stroke="#3a3f4f" stroke-width="1.5"/><text x="688" y="274" font-size="15" font-weight="700" fill="#f5f5f7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">People get it</text><text x="688" y="312" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">from the Marketplace or</text><text x="688" y="332" font-size="13" fill="#b8bccb" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Open VSX, on its own</text>
<text x="450" y="396" font-size="14" font-weight="600" fill="#f2a58a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Raising the protocol number? Release the extension first, then the plugin.</text>
</svg>
