<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="How the extension and symcc talk. In the VS Code or Cursor window, the board page is a webview; it and the extension pass messages to each other, and the extension passes them on to serve unread. The extension finds symcc, starts serve and does the editor glue: files, diffs, terminals, confirms and the status bar. In the symcc a harness installed, editor/webview/ is the board page, loaded from that copy, and editor/serve.mjs holds the board logic, the lead and the workers; it uses the engine and runs the agents, the Cursor SDK fetched on first use or the copilot CLI. The extension and serve talk in JSON lines: the contract, protocol 1. When the board opens: 1, find copies in symcc.pluginPath, then Claude Code, Copilot CLI and OpenCode. 2, pick the newest whose editor/serve.json number it speaks. 3, start editor/serve.mjs on the editor's own Node. 4, serve says it is ready, with its version and protocol 1. 5, show the copy's editor/webview/ with a strict content security policy.">
<title>How the extension and symcc talk</title>
